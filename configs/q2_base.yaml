seed: 42
data:
  raw_dir: data/q2
  clean_csv: results/q2_clean.csv
  split_csv: results/q2_split.csv
  strip_diacritics: true
  max_percentile: 95.0
  max_ratio: 2.5
tokenizer:
  min_freq: 2
  specials: ["<pad>", "<sos>", "<eos>", "<unk>"]
model:
  embed_dim: 256
  hidden_dim: 512
  num_layers: 1
  dropout: 0.2
train:
  batch_size: 64
  lr: 0.001
  epochs: 80
  patience: 8
  grad_clip: 1.0
  teacher_forcing: 1.0
  num_workers: 0
  reverse_source: true
