[project]
name = "genai-a1"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchinfo>=1.8.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10.4",
    "ImageHash>=4.3.1",
    "openpyxl>=3.1",
    "sacrebleu>=2.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "kaggle>=1.7",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
